name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Reproducible tested companions break cross-repository release-order cycles.
# Runtime installs remain unpinned; daily smoke validates the actual installed stack.
env:
  PI_CODEBUFFER_GENERATION_TARBALL: git+https://github.com/jacek4yang/pi-generation-recovery.git#f35e1c7b4a5de0080b33230a63d96dea8372e53b
  PI_CODEBUFFER_COMPANION_TARBALL: git+https://github.com/jacek4yang/pi-codex-native-compaction.git#d27cd26463249e7d37fb17536b7e40bc39d1260d
jobs:
  windows-boundary:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm exec -- tsx --test test/state.test.ts test/sdk.test.ts test/windows.ts
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run format:check
      - run: npm pack --json > pack-result.json
      - name: Isolated packaged SDK regressions and companion coexistence
        run: npm run smoke:install
      - name: Runtime-only installation (Git-style dependency layout)
        run: |
          runtime="$(mktemp -d)"
          npm install --prefix "$runtime" --omit=dev --legacy-peer-deps --ignore-scripts --no-audit --no-fund ./pi-codebuffer-*.tgz
          npm run smoke:install -- --installed "$runtime/node_modules/pi-codebuffer"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: pi-codebuffer-*.tgz
          if-no-files-found: error
          retention-days: 14
